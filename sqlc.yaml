version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: internal/spike/notestore/queries.sql
    gen:
      go:
        package: notestore
        out: internal/spike/notestore
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type:
              import: uuid
              type: UUID
